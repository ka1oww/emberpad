<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 100 100">
  <!-- EmberPad's laser pointer tool icon (EP105), original artwork. A slim pointer turned 45 degrees like the fountain
       pen, its red dot shown as a spot with rays at the tip. A template image: only the alpha is used. -->
  <g transform="translate(50 50) rotate(45) scale(0.88)" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body, with its button. -->
    <path d="M -9 -54 Q -9 -62 -1 -62 L 1 -62 Q 9 -62 9 -54 L 9 22 L -9 22 Z"/>
    <circle cx="0" cy="-30" r="3.4" fill="#000" stroke="none"/>
    <!-- Emitter. -->
    <path d="M -5.5 22 L -5.5 28 L 5.5 28 L 5.5 22"/>
    <!-- The spot and its rays. -->
    <circle cx="0" cy="46" r="7.5" fill="#000" stroke="none"/>
    <path d="M 0 59.5 L 0 66 M -13.5 46 L -20 46 M 13.5 46 L 20 46 M -9.6 55.6 L -14.2 60.2 M 9.6 55.6 L 14.2 60.2"/>
  </g>
</svg>
