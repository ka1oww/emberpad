name: Build and test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unsigned-builds:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Test shared models and persistence
        run: swift test --package-path EmberSyncKit --scratch-path "$RUNNER_TEMP/swift-build"
      - name: Build iPad app without signing
        run: xcodebuild -project EmberPad.xcodeproj -scheme EmberPad -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ios-build" CODE_SIGNING_ALLOWED=NO build
      - name: Build Companion without signing
        run: xcodebuild -project EmberPad.xcodeproj -scheme 'EmberPad Companion' -configuration Debug -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/mac-build" CODE_SIGNING_ALLOWED=NO build
      - name: Lint renewal artifacts without executing them
        run: |
          zsh -n resign/renew.zsh
          zsh -n resign/config.example.zsh
          plutil -lint resign/dev.emberpad.renew.plist Apps/EmberPad/Info.plist Apps/Companion/Info.plist
          python3 -c 'import ast, pathlib; ast.parse(pathlib.Path("resign/support.py").read_text())'

  # The iPad test target is split into three parallel shards, balanced by the
  # per-class runtimes in CI. Shards 1 and 2 list their classes explicitly;
  # shard 3 skips exactly those classes, so it runs everything else, including
  # any test class added later. Every test therefore runs in exactly one shard.
  ipad-tests:
    name: ipad-tests (shard ${{ matrix.shard }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            selection: >-
              -only-testing:EmberPadTests/PageToolsScreenshotTests
              -only-testing:EmberPadTests/AddPageScreenshotTests
              -only-testing:EmberPadTests/SearchReadOnlyScreenshotTests
              -only-testing:EmberPadTests/WorksheetHeaderScreenshotTests
              -only-testing:EmberPadTests/CircleLassoTests
              -only-testing:EmberPadTests/InkKeepsEveryStrokeTests
          - shard: 2
            selection: >-
              -only-testing:EmberPadTests/LibraryScreenshotTests
              -only-testing:EmberPadTests/EraserPreviewScreenshotTests
              -only-testing:EmberPadTests/PageNavigationTests
              -only-testing:EmberPadTests/LibraryFolderBrowserTests
              -only-testing:EmberPadTests/LiveInkTests
              -only-testing:EmberPadTests/LaserPointerScreenshotTests
          - shard: 3
            selection: >-
              -skip-testing:EmberPadTests/PageToolsScreenshotTests
              -skip-testing:EmberPadTests/AddPageScreenshotTests
              -skip-testing:EmberPadTests/SearchReadOnlyScreenshotTests
              -skip-testing:EmberPadTests/WorksheetHeaderScreenshotTests
              -skip-testing:EmberPadTests/CircleLassoTests
              -skip-testing:EmberPadTests/InkKeepsEveryStrokeTests
              -skip-testing:EmberPadTests/LibraryScreenshotTests
              -skip-testing:EmberPadTests/EraserPreviewScreenshotTests
              -skip-testing:EmberPadTests/PageNavigationTests
              -skip-testing:EmberPadTests/LibraryFolderBrowserTests
              -skip-testing:EmberPadTests/LiveInkTests
              -skip-testing:EmberPadTests/LaserPointerScreenshotTests
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      # A fresh runner's first simulator boot takes minutes, so start it before
      # checkout and let it overlap the build; the test step waits for it.
      - name: Start booting the Simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devs=json.load(sys.stdin)["devices"]; cands=[d for lst in devs.values() for d in lst]; pick=next((d for d in cands if d["name"].startswith("iPad")), next((d for d in cands if d["name"].startswith("iPhone")), None)); assert pick, "no simulator device"; print(pick["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
      - uses: actions/checkout@v4
      - name: Test iPad app on Simulator
        env:
          SELECTION: ${{ matrix.selection }}
        run: |
          xcrun simctl bootstatus "$UDID" -b
          # SELECTION is a space-separated list of flags; word splitting is intended.
          xcodebuild -project EmberPad.xcodeproj -scheme EmberPad -configuration Debug -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/ios-test" CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES $SELECTION test
